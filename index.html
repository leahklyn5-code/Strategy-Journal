<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="LevelHunter"/>
<title>Level Hunter Journal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#080b11;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;min-height:100vh;overscroll-behavior:none;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  input[type=date]{color-scheme:dark;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect}=React;

const INSTRUMENTS=["XAUUSD","XAGUSD","BTC/USDT","ETH/USDT","SOL/USDT","HYPE/USDT","Other"];
const STRATEGIES=["OB Pullback","Gainers"];
const SESSIONS=["London","New York","Asian","Overlap"];
const TRADES_KEY="lh-trades-v6";
const BE_TRIGGER_R=1.8,PARTIAL_PCT=0.60,REMAIN_PCT=0.40;
const GAINERS_PARTIAL_PCT=0.70,GAINERS_REMAIN_PCT=0.30;

function calcRR(entry,sl,tp){
  const e=parseFloat(entry),s=parseFloat(sl),t=parseFloat(tp);
  if(!e||!s||!t||e===s)return null;
  return Math.abs(t-e)/Math.abs(e-s);
}
function calcRAtPrice(entry,sl,price){
  const e=parseFloat(entry),s=parseFloat(sl),p=parseFloat(price);
  if(!e||!s||e===s||(!p&&p!==0))return null;
  return Math.abs(p-e)/Math.abs(e-s);
}
function calcPnlR(entry,sl,tp,outcome,strategy,supportPrice){
  const rr=calcRR(entry,sl,tp);
  const isGainers=strategy==="Gainers";
  const partialPct=isGainers?GAINERS_PARTIAL_PCT:PARTIAL_PCT;
  const remainPct=isGainers?GAINERS_REMAIN_PCT:REMAIN_PCT;
  const partialR=isGainers?calcRAtPrice(entry,sl,supportPrice):BE_TRIGGER_R;
  if(outcome==="Win"){if(rr===null)return null;return+rr.toFixed(2);}
  if(outcome==="Loss")return -1;
  if(outcome==="BE Stopped"){if(partialR===null)return null;return+(partialPct*partialR).toFixed(2);}
  if(outcome==="BE → TP"){if(rr===null||partialR===null)return null;return+(partialPct*partialR+remainPct*rr).toFixed(2);}
  return null;
}
function calcBEPrice(entry,sl){
  const e=parseFloat(entry),s=parseFloat(sl);
  if(!e||!s||e===s)return null;
  const risk=Math.abs(e-s),isLong=e>s;
  return isLong?e+(risk*BE_TRIGGER_R):e-(risk*BE_TRIGGER_R);
}
function fmtDollar(d){if(d==null)return"—";const a=Math.abs(d).toFixed(2);return d>=0?`+$${a}`:`-$${a}`;}
function getMonthKey(d){const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;}
function fmtMonth(key){const[y,m]=key.split("-");return new Date(y,parseInt(m)-1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
function fmtDate(d){return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}

const CLRS={green:{bg:"#052e16",bd:"#16a34a",tx:"#4ade80"},teal:{bg:"#022c22",bd:"#10b981",tx:"#6ee7b7"},red:{bg:"#2d0a0a",bd:"#dc2626",tx:"#f87171"},yellow:{bg:"#1c1400",bd:"#ca8a04",tx:"#facc15"},blue:{bg:"#0c1a2e",bd:"#2563eb",tx:"#60a5fa"},purple:{bg:"#1e1b3a",bd:"#818cf8",tx:"#a5b4fc"},gray:{bg:"#111827",bd:"#374151",tx:"#9ca3af"}};
const OUTCOME_CONFIG=[
  {id:"Win",label:"Win",sub:"Full TP · no partial taken",bg:"#052e16",bd:"#16a34a",tx:"#4ade80",requiresPartial:false},
  {id:"Loss",label:"Loss",sub:"SL hit · -1R",bg:"#2d0a0a",bd:"#dc2626",tx:"#f87171",requiresPartial:false},
  {id:"BE Stopped",label:"BE Stopped",sub:"Partial taken, rest stopped at entry (BE)",bg:"#1c1400",bd:"#ca8a04",tx:"#facc15",requiresPartial:true},
  {id:"BE → TP",label:"BE → TP",sub:"Partial taken, rest ran to TP",bg:"#022c22",bd:"#10b981",tx:"#6ee7b7",requiresPartial:true},
  {id:"Open",label:"Open",sub:"Still running",bg:"#0c1a2e",bd:"#2563eb",tx:"#60a5fa",requiresPartial:null},
];
const ocMap={"Win":"green","Loss":"red","BE Stopped":"yellow","BE → TP":"teal","Open":"blue"};

function Badge({children,color}){
  const c=CLRS[color]||CLRS.gray;
  return <span style={{background:c.bg,border:`1px solid ${c.bd}`,color:c.tx,borderRadius:4,padding:"2px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{children}</span>;
}
function RTag({v}){
  if(v===null||v===undefined)return<Badge color="blue">Open</Badge>;
  if(v>0)return<Badge color="green">+{v}R</Badge>;
  if(v<0)return<Badge color="red">{v}R</Badge>;
  return<Badge color="yellow">0.00R</Badge>;
}
function DollarTag({d}){
  if(d===null||d===undefined)return null;
  const color=d>0?"green":d<0?"red":"yellow";
  return<Badge color={color}>{fmtDollar(d)}</Badge>;
}
function EquityCurve({points}){
  if(!points||points.length<2)return null;
  const w=100,h=52;
  const mn=Math.min(0,...points),mx=Math.max(0,...points);
  const span=(mx-mn)||1;
  const stepX=w/(points.length-1);
  const coords=points.map((p,i)=>`${(i*stepX).toFixed(2)},${(h-((p-mn)/span)*h).toFixed(2)}`);
  const last=points[points.length-1];
  const color=last>=0?"#4ade80":"#f87171";
  const zeroY=(h-((0-mn)/span)*h).toFixed(2);
  return(
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{width:"100%",height:56,display:"block"}}>
      <line x1="0" y1={zeroY} x2={w} y2={zeroY} stroke="#1f2937" strokeWidth="0.6" strokeDasharray="2,2"/>
      <path d={`M0,${h} L${coords.join(" L")} L${w},${h} Z`} fill={color} fillOpacity="0.12" stroke="none"/>
      <path d={`M${coords.join(" L")}`} fill="none" stroke={color} strokeWidth="1.6" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
}

function PriceMap({entry,sl,tp,outcome,partialHit,strategy,supportPrice}){
  const e=parseFloat(entry),s=parseFloat(sl),t=parseFloat(tp);
  if(!e||!s||!t)return null;
  const rr=calcRR(entry,sl,tp);
  const isGainers=strategy==="Gainers";
  const beP=isGainers?(parseFloat(supportPrice)||null):calcBEPrice(entry,sl);
  const beLabel=isGainers?"Support":"BE 1.8R";
  const isLong=t>e;
  const pts=[s,e,t,...(beP?[beP]:[])];
  const mn=Math.min(...pts),mx=Math.max(...pts),span=mx-mn||1;
  const pct=v=>((v-mn)/span)*76+12;
  const levels=[
    {price:s,label:"SL",color:"#f87171",dot:8},
    {price:e,label:"Entry",color:"#f59e0b",dot:11},
    ...(beP?[{price:beP,label:beLabel,color:partialHit?"#facc15":"#6b7280",dot:8}]:[]),
    {price:t,label:"TP",color:"#4ade80",dot:8},
  ].sort((a,b)=>isLong?a.price-b.price:b.price-a.price);
  return(
    <div style={{background:"#06090f",border:"1px solid #1a2233",borderRadius:10,padding:"14px 16px",marginTop:12}}>
      <div style={{fontSize:10,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>
        Price Map · {isLong?"Long ▲":"Short ▼"} · {rr?"1:"+rr.toFixed(2):"—"}
        {partialHit&&<span style={{color:"#facc15",marginLeft:8}}>⚡ Partial confirmed</span>}
      </div>
      <div style={{position:"relative",height:levels.length>3?130:100}}>
        <div style={{position:"absolute",left:"50%",top:0,bottom:0,width:2,background:"#1f2937",transform:"translateX(-50%)"}}/>
        <div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",width:2,top:`${Math.min(pct(s),pct(t))}%`,height:`${Math.abs(pct(t)-pct(s))}%`,background:outcome==="Loss"?"#dc262650":"#16a34a30"}}/>
        {beP&&<div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",width:6,borderRadius:3,top:`${Math.min(pct(e),pct(beP))}%`,height:`${Math.abs(pct(beP)-pct(e))}%`,background:partialHit?"#facc1530":"#37415130"}}/>}
        {levels.map((bar,i)=>{
          const right=i%2===0;
          return(
            <div key={bar.label} style={{position:"absolute",top:`${pct(bar.price)}%`,left:0,right:0,transform:"translateY(-50%)",display:"flex",alignItems:"center"}}>
              <div style={{flex:1,textAlign:"right",paddingRight:10,fontSize:10,color:bar.color,fontFamily:"monospace",fontWeight:700}}>{right?"":bar.price.toFixed(2)}</div>
              <div style={{width:bar.dot,height:bar.dot,borderRadius:"50%",background:bar.color,flexShrink:0,zIndex:1,boxShadow:bar.label==="Entry"?`0 0 8px ${bar.color}`:"none"}}/>
              <div style={{flex:1,paddingLeft:10,fontSize:10,color:bar.color,fontWeight:700}}>
                <span style={{background:"#06090f",padding:"1px 5px",borderRadius:3}}>{bar.label}{right?" "+bar.price.toFixed(2):""}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PnlBreakdown({entry,sl,tp,outcome,riskAmount,strategy,supportPrice}){
  const rr=calcRR(entry,sl,tp);
  const pnl=calcPnlR(entry,sl,tp,outcome,strategy,supportPrice);
  if(pnl===null||outcome==="Open")return null;
  const isGainers=strategy==="Gainers";
  const partialPct=isGainers?GAINERS_PARTIAL_PCT:PARTIAL_PCT;
  const remainPct=isGainers?GAINERS_REMAIN_PCT:REMAIN_PCT;
  const partialR=isGainers?calcRAtPrice(entry,sl,supportPrice):BE_TRIGGER_R;
  const beP=isGainers?(parseFloat(supportPrice)||null):calcBEPrice(entry,sl);
  const pctLabel=`${Math.round(partialPct*100)}%`,remainLabel=`${Math.round(remainPct*100)}%`;
  const triggerLabel=isGainers?"support":`BE ${BE_TRIGGER_R}R`;
  const risk=parseFloat(riskAmount)||0;
  const rows=[];
  if(outcome==="Win"){
    rows.push({label:"Full position to TP (no partial taken)",r:`+${rr.toFixed(2)}R`,d:risk*rr,color:"#4ade80"});
  }else if(outcome==="Loss"){
    rows.push({label:"Full position stopped at SL",r:"-1.00R",d:-risk,color:"#f87171"});
  }else if(outcome==="BE Stopped"){
    rows.push({label:`${pctLabel} at ${triggerLabel} ${beP?"("+beP.toFixed(2)+")":""}`,r:`+${(partialPct*partialR).toFixed(2)}R`,d:risk*(partialPct*partialR),color:"#facc15"});
    rows.push({label:`${remainLabel} stopped at entry — no loss`,r:"0.00R",d:0,color:"#6b7280"});
  }else if(outcome==="BE → TP"){
    rows.push({label:`${pctLabel} at ${triggerLabel} ${beP?"("+beP.toFixed(2)+")":""}`,r:`+${(partialPct*partialR).toFixed(2)}R`,d:risk*(partialPct*partialR),color:"#6ee7b7"});
    rows.push({label:`${remainLabel} runs to full TP`,r:`+${(remainPct*rr).toFixed(2)}R`,d:risk*(remainPct*rr),color:"#6ee7b7"});
  }
  const totalDollar=risk*pnl;
  return(
    <div style={{background:"#0a0e18",border:"1px solid #1a2233",borderRadius:10,overflow:"hidden",marginTop:10}}>
      <div style={{padding:"10px 14px",borderBottom:"1px solid #1a2233",fontSize:10,color:"#6b7280",letterSpacing:2,textTransform:"uppercase"}}>P&L Breakdown</div>
      {rows.map((r,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 14px",borderBottom:i<rows.length-1?"1px solid #111827":"none"}}>
          <span style={{fontSize:12,color:"#9ca3af"}}>{r.label}</span>
          <span style={{display:"flex",gap:8,alignItems:"baseline"}}>
            <span style={{fontFamily:"monospace",fontWeight:700,fontSize:14,color:r.color}}>{r.r}</span>
            <span style={{fontFamily:"monospace",fontSize:12,color:"#6b7280"}}>{fmtDollar(r.d)}</span>
          </span>
        </div>
      ))}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",background:"#060a10"}}>
        <span style={{fontSize:12,fontWeight:700,color:"#e5e7eb"}}>Total P&L</span>
        <span style={{display:"flex",gap:10,alignItems:"baseline"}}>
          <span style={{fontFamily:"monospace",fontWeight:800,fontSize:20,color:pnl>0?"#4ade80":pnl<0?"#f87171":"#facc15"}}>{pnl>0?"+":""}{pnl}R</span>
          <span style={{fontFamily:"monospace",fontWeight:800,fontSize:16,color:totalDollar>0?"#4ade80":totalDollar<0?"#f87171":"#facc15"}}>{fmtDollar(totalDollar)}</span>
        </span>
      </div>
    </div>
  );
}

function App(){
  const[trades,setTrades]=useState([]);
  const[loaded,setLoaded]=useState(false);
  const[view,setView]=useState("log");
  const[saved,setSaved]=useState(false);
  const[saveError,setSaveError]=useState(false);
  const[editId,setEditId]=useState(null);
  const[resetArm,setResetArm]=useState(false);
  const[importMsg,setImportMsg]=useState("");
  const emptyForm=()=>({date:new Date().toISOString().slice(0,10),instrument:"XAUUSD",strategy:"OB Pullback",session:"London",entry:"",sl:"",tp:"",riskAmount:"",partialHit:false,outcome:"Open",supportPrice:"",notes:""});
  const[form,setForm]=useState(emptyForm());

  useEffect(()=>{
    try{
      const raw=localStorage.getItem(TRADES_KEY);
      if(raw)setTrades(JSON.parse(raw));
    }catch(e){/* no trades saved yet, or storage blocked */}
    setLoaded(true);
  },[]);

  function persist(u){
    setTrades(u);
    try{
      localStorage.setItem(TRADES_KEY,JSON.stringify(u));
      setSaveError(false);
    }catch(e){setSaveError(true);}
  }

  const rr=calcRR(form.entry,form.sl,form.tp);
  const isGainers=form.strategy==="Gainers";
  const pnlPrev=calcPnlR(form.entry,form.sl,form.tp,form.outcome,form.strategy,form.supportPrice);
  const beP=isGainers?(parseFloat(form.supportPrice)||null):calcBEPrice(form.entry,form.sl);
  const supportR=isGainers?calcRAtPrice(form.entry,form.sl,form.supportPrice):null;
  const visibleOutcomes=OUTCOME_CONFIG.filter(o=>o.requiresPartial===null||o.requiresPartial===form.partialHit);

  function setPartialHit(v){
    setForm(f=>{
      const validIds=OUTCOME_CONFIG.filter(o=>o.requiresPartial===null||o.requiresPartial===v).map(o=>o.id);
      const outcome=validIds.includes(f.outcome)?f.outcome:"Open";
      return{...f,partialHit:v,outcome};
    });
  }

  function handleSave(){
    if(!form.entry||!form.sl||!form.tp)return;
    const riskAmount=parseFloat(form.riskAmount)||0;
    const rrVal=rr?+rr.toFixed(2):null;
    const dollarPnl=pnlPrev!=null?+(pnlPrev*riskAmount).toFixed(2):null;
    const trade={id:editId||Date.now(),...form,riskAmount,rr:rrVal,pnlR:pnlPrev,dollarPnl,savedAt:new Date().toISOString()};
    persist(editId?trades.map(t=>t.id===editId?trade:t):[trade,...trades]);
    setSaved(true);setEditId(null);setForm(emptyForm());
    setTimeout(()=>setSaved(false),2000);
  }
  function handleEdit(t){setForm({date:t.date,instrument:t.instrument,strategy:t.strategy,session:t.session,entry:String(t.entry),sl:String(t.sl),tp:String(t.tp),riskAmount:t.riskAmount!=null?t.riskAmount:"",partialHit:!!t.partialHit,outcome:t.outcome,supportPrice:t.supportPrice!=null?String(t.supportPrice):"",notes:t.notes||""});setEditId(t.id);setView("log");}
  function handleDelete(id){persist(trades.filter(t=>t.id!==id));}
  function handleResetClick(){
    if(!resetArm){setResetArm(true);setTimeout(()=>setResetArm(false),3000);return;}
    persist([]);setResetArm(false);
  }

  function exportCSV(){
    const h=["Date","Instrument","Strategy","Session","Entry","SL","TP","R:R","Partial Hit","Support Price","Outcome","P&L(R)","Risk($)","P&L($)","Notes"];
    const rows=trades.map(t=>[t.date,t.instrument,t.strategy,t.session,t.entry,t.sl,t.tp,t.rr?`1:${t.rr}`:"",t.partialHit?"Yes":"No",t.supportPrice||"",t.outcome,t.pnlR!=null?t.pnlR:"",t.riskAmount!=null?t.riskAmount:"",t.dollarPnl!=null?t.dollarPnl:"",`"${(t.notes||"").replace(/"/g,'""')}"`]);
    const csv=[h,...rows].map(r=>r.join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="LevelHunter.csv";a.click();
  }

  function exportBackup(){
    const data=JSON.stringify(trades,null,2);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download=`LevelHunter-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setImportMsg("Backup file downloaded.");
    setTimeout(()=>setImportMsg(""),3000);
  }
  function importBackup(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!Array.isArray(parsed))throw new Error("bad shape");
        persist(parsed);
        setImportMsg(`Restored ${parsed.length} trade${parsed.length===1?"":"s"} from backup.`);
      }catch(err){
        setImportMsg("Couldn't read that file — is it a Level Hunter backup?");
      }
      setTimeout(()=>setImportMsg(""),4000);
    };
    reader.readAsText(file);
    e.target.value="";
  }

  const monthlySummary=(()=>{
    const map={};
    trades.forEach(t=>{
      if(t.outcome==="Open")return;
      const k=getMonthKey(t.date);
      if(!map[k])map[k]={wins:0,losses:0,beStop:0,beStopR:0,betp:0,totalR:0,totalDollar:0,count:0};
      map[k].count++;map[k].totalR+=t.pnlR||0;map[k].totalDollar+=t.dollarPnl||0;
      if(t.outcome==="Win")map[k].wins++;
      else if(t.outcome==="Loss")map[k].losses++;
      else if(t.outcome==="BE Stopped"){map[k].wins++;map[k].beStop++;map[k].beStopR+=t.pnlR||0;}
      else if(t.outcome==="BE → TP"){map[k].wins++;map[k].betp++;}
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  })();

  const card={background:"#0a0e18",border:"1px solid #1a2233",borderRadius:12,padding:18,marginBottom:14};
  const inp={background:"#0f1117",border:"1px solid #1f2937",borderRadius:8,color:"#e5e7eb",padding:"11px 13px",fontSize:15,width:"100%",outline:"none",fontFamily:"monospace"};
  const lbl={fontSize:11,color:"#6b7280",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:1};
  const saveBtn={width:"100%",padding:"14px 0",background:"#f59e0b",color:"#000",border:"none",borderRadius:10,fontWeight:800,fontSize:15,cursor:"pointer",marginTop:6,boxShadow:"0 4px 20px #f59e0b30"};
  const navBtn=a=>({flex:1,padding:"10px 0",background:a?"#1a2233":"transparent",border:a?"1px solid #f59e0b40":"1px solid transparent",color:a?"#f59e0b":"#6b7280",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13});

  if(!loaded){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#4b5563",fontSize:13}}>
        Loading journal…
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",background:"#080b11",color:"#e5e7eb",maxWidth:480,margin:"0 auto"}}>

      {/* Header */}
      <div style={{padding:"20px 18px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:10,color:"#f59e0b",letterSpacing:3,textTransform:"uppercase"}}>The Level Hunter</div>
          <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.5}}>Trade Journal</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:11,color:"#4b5563"}}>{trades.length} trades</div>
          <button onClick={exportCSV} style={{fontSize:11,color:"#6b7280",background:"none",border:"none",cursor:"pointer",padding:0,marginTop:3,display:"block"}}>↓ Export CSV</button>
          <button onClick={exportBackup} style={{fontSize:11,color:"#6b7280",background:"none",border:"none",cursor:"pointer",padding:0,marginTop:3,display:"block"}}>↓ Backup (.json)</button>
          <label style={{fontSize:11,color:"#6b7280",cursor:"pointer",padding:0,marginTop:3,display:"block"}}>
            ↑ Restore backup
            <input type="file" accept="application/json" style={{display:"none"}} onChange={importBackup}/>
          </label>
          <button onClick={handleResetClick} style={{fontSize:11,color:resetArm?"#f87171":"#374151",background:"none",border:"none",cursor:"pointer",padding:0,marginTop:3,display:"block"}}>{resetArm?"Tap again to confirm":"Reset data"}</button>
        </div>
      </div>
      {saveError&&<div style={{margin:"10px 18px 0",fontSize:11,color:"#f87171",background:"#2d0a0a",border:"1px solid #dc262640",borderRadius:6,padding:"6px 10px"}}>Couldn't save to this browser's storage — it may be full or restricted.</div>}
      {importMsg&&<div style={{margin:"10px 18px 0",fontSize:11,color:"#4ade80",background:"#052e16",border:"1px solid #16a34a40",borderRadius:6,padding:"6px 10px"}}>{importMsg}</div>}

      {/* Nav */}
      <div style={{display:"flex",gap:8,padding:"14px 18px 0"}}>
        {[["log","Log Trade"],["history","History"],["monthly","Monthly"]].map(([id,label])=>(
          <button key={id} onClick={()=>{setView(id);if(id!=="log"){setEditId(null);setForm(emptyForm());}}} style={navBtn(view===id)}>{label}</button>
        ))}
      </div>

      <div style={{padding:"16px 18px 80px"}}>

        {/* ═══ LOG ═══ */}
        {view==="log"&&<>
          {editId&&<div style={{background:"#1a1200",border:"1px solid #b45309",borderRadius:8,padding:"8px 14px",marginBottom:14,fontSize:12,color:"#fbbf24"}}>✏️ Editing — save to update</div>}

          <div style={card}>
            <span style={lbl}>Instrument</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
              {INSTRUMENTS.map(i=>(
                <button key={i} onClick={()=>setForm(f=>({...f,instrument:i}))} style={{padding:"7px 13px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",background:form.instrument===i?"#1a1200":"#0f1117",border:`1px solid ${form.instrument===i?"#f59e0b":"#1f2937"}`,color:form.instrument===i?"#f59e0b":"#6b7280"}}>{i}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{flex:1}}>
                <span style={lbl}>Date</span>
                <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={{...inp,fontFamily:"inherit",fontSize:13}}/>
              </div>
              <div style={{flex:1}}>
                <span style={lbl}>Session</span>
                <select value={form.session} onChange={e=>setForm(f=>({...f,session:e.target.value}))} style={{...inp,fontFamily:"inherit",fontSize:13}}>
                  {SESSIONS.map(s=><option key={s}>{s}</option>)}
                </select>
              </div>
            </div>
            <div>
              <span style={lbl}>Strategy</span>
              <select value={form.strategy} onChange={e=>setForm(f=>({...f,strategy:e.target.value}))} style={{...inp,fontFamily:"inherit",fontSize:13}}>
                {STRATEGIES.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>

          <div style={card}>
            <div style={{fontSize:12,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:14}}>Risk Amount</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontFamily:"monospace",fontWeight:800,fontSize:18,color:"#f59e0b"}}>$</span>
              <input inputMode="decimal" value={form.riskAmount} onChange={e=>setForm(f=>({...f,riskAmount:e.target.value}))} placeholder="Enter amount risked" style={{...inp,flex:1}}/>
            </div>
            <div style={{fontSize:11,color:"#4b5563",marginTop:10}}>Dollars risked on this trade — converts every R figure below into $.</div>
          </div>

          <div style={card}>
            <div style={{fontSize:12,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:14}}>Prices</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
              {[["Entry","entry","#1f2937"],["Stop Loss","sl","#dc262640"],["Take Profit","tp","#16a34a40"]].map(([label,key,bc])=>(
                <div key={key}>
                  <span style={lbl}>{label}</span>
                  <input inputMode="decimal" value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} placeholder="0.00" style={{...inp,borderColor:bc}}/>
                </div>
              ))}
            </div>

            {(isGainers||beP)&&(
              <div style={{background:"#0d1117",border:"1px solid #ca8a0430",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
                {isGainers?(
                  <>
                    <div style={{fontSize:10,color:"#ca8a04",letterSpacing:2,textTransform:"uppercase",fontWeight:700,marginBottom:8}}>Nearest Major Support (your 70% level)</div>
                    <input inputMode="decimal" value={form.supportPrice} onChange={e=>setForm(f=>({...f,supportPrice:e.target.value}))} placeholder="Enter the support price" style={{...inp,borderColor:"#ca8a0440"}}/>
                    {supportR!==null&&<div style={{marginTop:8,fontSize:12,color:"#facc15",fontFamily:"monospace",fontWeight:700}}>≈ 1 : {supportR.toFixed(2)} at this level</div>}
                  </>
                ):(
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:10,color:"#ca8a04",letterSpacing:2,textTransform:"uppercase",fontWeight:700}}>Your BE Level (1.8R)</div>
                      <div style={{fontSize:11,color:"#6b7280",marginTop:3}}>Partial target · move SL to entry here</div>
                    </div>
                    <div style={{fontFamily:"monospace",fontWeight:800,fontSize:18,color:"#facc15"}}>{beP.toFixed(2)}</div>
                  </div>
                )}
                {beP&&<>
                  <div style={{marginTop:10,fontSize:11,color:"#9ca3af",marginBottom:6}}>Did price reach this level, and did you take your partial + move stop to breakeven?</div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>setPartialHit(false)} style={{flex:1,padding:"9px 0",borderRadius:7,fontSize:12,fontWeight:700,cursor:"pointer",background:!form.partialHit?"#111827":"#0f1117",border:`1px solid ${!form.partialHit?"#4b5563":"#1f2937"}`,color:!form.partialHit?"#e5e7eb":"#6b7280"}}>No — hasn't hit yet</button>
                    <button onClick={()=>setPartialHit(true)} style={{flex:1,padding:"9px 0",borderRadius:7,fontSize:12,fontWeight:700,cursor:"pointer",background:form.partialHit?"#1c1400":"#0f1117",border:`1px solid ${form.partialHit?"#ca8a04":"#1f2937"}`,color:form.partialHit?"#facc15":"#6b7280"}}>Yes — moved to BE</button>
                  </div>
                </>}
              </div>
            )}

            <PriceMap entry={form.entry} sl={form.sl} tp={form.tp} outcome={form.outcome} partialHit={form.partialHit} strategy={form.strategy} supportPrice={form.supportPrice}/>

            {rr!==null&&(
              <div style={{marginTop:10,background:"#0f1117",border:`1px solid ${rr>=2?"#16a34a40":"#f59e0b40"}`,borderRadius:8,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",letterSpacing:1,textTransform:"uppercase"}}>R : R</div>
                  <div style={{fontFamily:"monospace",fontWeight:800,fontSize:22,color:rr>=2?"#4ade80":"#f59e0b"}}>1 : {rr.toFixed(2)}</div>
                </div>
                <div style={{textAlign:"right",fontSize:11,color:"#6b7280"}}>
                  {form.partialHit?<div style={{color:"#facc15",fontWeight:700}}>Partial confirmed at {beP?.toFixed(2)}</div>:<div>No partial confirmed yet</div>}
                </div>
              </div>
            )}
          </div>

          <div style={card}>
            <div style={{fontSize:12,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:14}}>What Happened?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              {visibleOutcomes.map(({id,label,sub,bg:bg2,bd,tx})=>{
                const active=form.outcome===id;
                return(
                  <button key={id} onClick={()=>setForm(f=>({...f,outcome:id}))} style={{padding:"12px 10px",borderRadius:9,cursor:"pointer",textAlign:"left",background:active?bg2:"#0f1117",border:`1px solid ${active?bd:"#1f2937"}`,color:active?tx:"#6b7280"}}>
                    <div style={{fontWeight:700,fontSize:13}}>{label}</div>
                    <div style={{fontSize:10,opacity:0.75,marginTop:3}}>{sub}</div>
                  </button>
                );
              })}
            </div>
            {!form.partialHit&&<div style={{fontSize:11,color:"#374151",marginBottom:10}}>Mark "Yes — moved to BE" above once price hits your partial to unlock BE outcomes.</div>}
            <PnlBreakdown entry={form.entry} sl={form.sl} tp={form.tp} outcome={form.outcome} riskAmount={form.riskAmount} strategy={form.strategy} supportPrice={form.supportPrice}/>
          </div>

          <div style={card}>
            <span style={lbl}>Notes (optional)</span>
            <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Setup, confluences, lessons..." style={{...inp,fontFamily:"inherit",fontSize:13,height:70,resize:"vertical"}}/>
          </div>

          <button onClick={handleSave} disabled={!form.entry||!form.sl||!form.tp} style={{...saveBtn,opacity:(!form.entry||!form.sl||!form.tp)?0.4:1}}>
            {saved?"✓ Saved!":editId?"Update Trade":"Save Trade"}
          </button>
          {editId&&<button onClick={()=>{setEditId(null);setForm(emptyForm());}} style={{...saveBtn,background:"transparent",color:"#6b7280",border:"1px solid #1f2937",boxShadow:"none",marginTop:8}}>Cancel</button>}
        </>}

        {/* ═══ HISTORY ═══ */}
        {view==="history"&&<>
          {trades.length===0&&<div style={{color:"#374151",textAlign:"center",padding:48,fontSize:13}}>No trades logged yet.</div>}
          {trades.map(t=>{
            const oc=ocMap[t.outcome]||"gray";
            return(
              <div key={t.id} style={{...card,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:17}}>{t.instrument}</div>
                    <div style={{fontSize:11,color:"#4b5563",marginTop:2}}>{fmtDate(t.date)} · {t.session} · {t.strategy.split("—")[0].trim()} · Risk ${t.riskAmount!=null?t.riskAmount:"—"}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                    <Badge color={oc}>{t.outcome}</Badge>
                    <div style={{display:"flex",gap:5}}>
                      <RTag v={t.pnlR}/>
                      <DollarTag d={t.dollarPnl}/>
                    </div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",background:"#0f1117",borderRadius:8,padding:"10px 12px",marginBottom:8,gap:4}}>
                  {[["Entry",t.entry,"#e5e7eb"],["SL",t.sl,"#f87171"],["TP",t.tp,"#4ade80"],["R:R",t.rr?`1:${t.rr}`:"—","#f59e0b"]].map(([k,v,c])=>(
                    <div key={k} style={{textAlign:"center"}}>
                      <div style={{fontSize:9,color:"#6b7280",letterSpacing:1,textTransform:"uppercase"}}>{k}</div>
                      <div style={{fontFamily:"monospace",fontSize:12,fontWeight:600,color:c}}>{v}</div>
                    </div>
                  ))}
                </div>
                {t.partialHit&&<div style={{marginBottom:8}}><Badge color="yellow">⚡ Partial taken at {(t.strategy==="Gainers"?parseFloat(t.supportPrice):calcBEPrice(t.entry,t.sl))?.toFixed(2)}</Badge></div>}
                {t.notes&&<div style={{fontSize:12,color:"#4b5563",marginBottom:10,lineHeight:1.5}}>{t.notes}</div>}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>handleEdit(t)} style={{flex:1,padding:"7px 0",background:"#0f1117",border:"1px solid #1f2937",color:"#9ca3af",borderRadius:7,fontSize:12,cursor:"pointer",fontWeight:600}}>Edit</button>
                  <button onClick={()=>handleDelete(t.id)} style={{flex:1,padding:"7px 0",background:"#0f1117",border:"1px solid #dc262640",color:"#f87171",borderRadius:7,fontSize:12,cursor:"pointer",fontWeight:600}}>Delete</button>
                </div>
              </div>
            );
          })}
        </>}

        {/* ═══ MONTHLY ═══ */}
        {view==="monthly"&&<>
          {(()=>{
            const cl=trades.filter(t=>t.outcome!=="Open");
            const beStops=cl.filter(t=>t.outcome==="BE Stopped").length;
            const wins=cl.filter(t=>t.outcome==="Win"||t.outcome==="BE → TP"||t.outcome==="BE Stopped").length;
            const losses=cl.filter(t=>t.outcome==="Loss").length;
            const wr=cl.length?Math.round((wins/cl.length)*100):null;
            const totalR=cl.reduce((s,t)=>s+(t.pnlR||0),0);
            const totalDollar=cl.reduce((s,t)=>s+(t.dollarPnl||0),0);
            const avgR=cl.length?(totalR/cl.length).toFixed(2):"0.00";
            const avgDollar=cl.length?(totalDollar/cl.length):0;
            const grossProfit=cl.reduce((s,t)=>s+((t.pnlR||0)>0?t.pnlR:0),0);
            const grossLoss=Math.abs(cl.reduce((s,t)=>s+((t.pnlR||0)<0?t.pnlR:0),0));
            const profitFactor=grossLoss>0?grossProfit/grossLoss:(grossProfit>0?null:0);
            const pfDisplay=profitFactor===null?"∞":profitFactor.toFixed(2);
            const bestTrade=cl.length?Math.max(...cl.map(t=>t.pnlR||0)):0;
            const sortedClosed=[...cl].sort((a,b)=>new Date(a.date)-new Date(b.date));
            let running=0;
            const curve=sortedClosed.map(t=>{running+=(t.pnlR||0);return+running.toFixed(2);});
            return(
              <div style={{...card,marginBottom:20}}>
                <div style={{fontSize:10,color:"#f59e0b",letterSpacing:3,textTransform:"uppercase",marginBottom:12}}>All Time</div>
                {curve.length>=2&&(
                  <div style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#4b5563",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>
                      <span>Equity Curve (R)</span>
                      <span style={{color:totalR>=0?"#4ade80":"#f87171",fontFamily:"monospace"}}>{totalR>=0?"+":""}{totalR.toFixed(2)}R</span>
                    </div>
                    <div style={{background:"#06090f",border:"1px solid #1a2233",borderRadius:8,padding:"8px 10px"}}>
                      <EquityCurve points={[0,...curve]}/>
                    </div>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {[
                    ["Win Rate",wr===null?"—":`${wr}%`,wr===null?"#6b7280":wr>=50?"#4ade80":"#f87171",`${wins}W / ${losses}L${beStops?` (${beStops} via BE)`:""}`],
                    ["Profit Factor",pfDisplay,profitFactor===null||profitFactor>=1.5?"#4ade80":profitFactor>=1?"#facc15":"#f87171","profit ÷ loss"],
                    ["Total R",`${totalR>=0?"+":""}${totalR.toFixed(2)}R`,totalR>=0?"#4ade80":"#f87171",`${cl.length} closed`],
                    ["Total $",fmtDollar(totalDollar),totalDollar>=0?"#4ade80":"#f87171","across all trades"],
                    ["Avg / Trade",`${parseFloat(avgR)>=0?"+":""}${avgR}R`,parseFloat(avgR)>=0?"#4ade80":"#f87171",fmtDollar(avgDollar)+" avg"],
                    ["Best Trade",`${bestTrade>=0?"+":""}${bestTrade.toFixed(2)}R`,bestTrade>=0?"#4ade80":"#f87171","single trade"],
                    ["Open",trades.filter(t=>t.outcome==="Open").length,"#60a5fa","running"],
                  ].map(([k,v,c,sub])=>(
                    <div key={k} style={{background:"#0f1117",borderRadius:8,padding:"12px 14px"}}>
                      <div style={{fontFamily:"monospace",fontWeight:800,fontSize:20,color:c}}>{v}</div>
                      <div style={{fontSize:10,color:"#6b7280",textTransform:"uppercase",letterSpacing:1,marginTop:2}}>{k}</div>
                      <div style={{fontSize:10,color:"#374151",marginTop:2}}>{sub}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
          <div style={{fontSize:11,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>Monthly Breakdown</div>
          {monthlySummary.length===0&&<div style={{color:"#374151",textAlign:"center",padding:32,fontSize:13}}>No closed trades yet.</div>}
          {monthlySummary.map(([key,m])=>{
            const wr=m.count?Math.round((m.wins/m.count)*100):null;
            const avgR=m.count?(m.totalR/m.count).toFixed(2):"0.00";
            return(
              <div key={key} style={card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{fmtMonth(key)}</div>
                    <div style={{fontSize:11,color:"#4b5563",marginTop:2}}>{m.count} trades closed</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"monospace",fontWeight:800,fontSize:22,color:m.totalR>=0?"#4ade80":"#f87171"}}>{m.totalR>=0?"+":""}{m.totalR.toFixed(2)}R</div>
                    <div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:m.totalDollar>=0?"#4ade80":"#f87171"}}>{fmtDollar(m.totalDollar)}</div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:10}}>
                  {[["Win Rate",wr===null?"—":`${wr}%`,wr===null?"#6b7280":wr>=50?"#4ade80":"#f87171"],["Wins",m.wins,"#4ade80"],["Losses",m.losses,"#f87171"],["Avg R",`${parseFloat(avgR)>=0?"+":""}${avgR}R`,parseFloat(avgR)>=0?"#4ade80":"#f87171"]].map(([k,v,c])=>(
                    <div key={k} style={{background:"#0f1117",borderRadius:7,padding:"9px 10px",textAlign:"center"}}>
                      <div style={{fontSize:16,fontWeight:800,color:c}}>{v}</div>
                      <div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{k}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {m.betp>0&&<Badge color="teal">{m.betp} × BE → TP</Badge>}
                  {m.beStop>0&&<Badge color="yellow">{m.beStop} × BE Stopped ({m.beStopR>=0?"+":""}{m.beStopR.toFixed(2)}R total)</Badge>}
                </div>
              </div>
            );
          })}
        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
  </html>
